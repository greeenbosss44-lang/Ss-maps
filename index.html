<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ss Maps</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1F3FBF">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    --bg:#F4F7FB; --card:#FFFFFF; --ink:#13203A; --muted:#5C6B85;
    --blue:#1F3FBF; --blue-soft:#E3E9FB; --saffron:#F2A900; --line:#D9E0EE;
    box-sizing:border-box;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0E1526; --card:#172036; --ink:#EAF0FF; --muted:#9DABC9; --blue:#7F95FF; --blue-soft:#232F55; --line:#2A3558; }
  }
  *,*::before,*::after{box-sizing:inherit}
  html,body{height:100%;margin:0}
  body{font-family:'Tajawal',system-ui,sans-serif;background:var(--bg);color:var(--ink);
    display:flex;flex-direction:column;
    padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  header{padding:12px 14px 8px;background:var(--card);border-bottom:1px solid var(--line)}
  .top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
  h1{font-size:20px;margin:0;font-weight:800}
  .slogan{margin:0 0 8px;color:var(--muted);font-size:14px}
  .row{display:flex;gap:8px}
  select,input,textarea,button{font-family:inherit;font-size:16px}
  select,input,textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
  select:focus,input:focus,textarea:focus,button:focus-visible{outline:3px solid var(--saffron);outline-offset:1px}
  #langSel{width:auto;padding:6px 8px;font-size:14px}
  #map{flex:1 1 40%;min-height:220px;z-index:0}
  main{flex:1 1 50%;overflow-y:auto;padding:12px 14px 20px;background:var(--bg)}
  .sheet-title{display:flex;justify-content:space-between;align-items:center;margin:0 0 10px;gap:8px}
  .sheet-title h2{font-size:18px;margin:0}
  .btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer;background:var(--blue);color:#fff}
  .btn.alt{background:var(--blue-soft);color:var(--blue)}
  .btn.go{background:var(--saffron);color:#1b1500}
  .btn.full{width:100%;margin-bottom:10px}
  .btn.small{padding:6px 10px;font-size:14px}
  .person{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
  .person b{font-size:17px}
  .person p{margin:4px 0 10px;color:var(--muted)}
  .actions{display:flex;flex-wrap:wrap;gap:8px}
  .actions a{text-decoration:none;display:inline-block}
  .empty{padding:18px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:14px}
  #routeBox{background:var(--blue-soft);border-radius:14px;padding:12px;margin-bottom:12px;display:none}
  #routeBox strong{font-size:18px}
  dialog{border:0;border-radius:16px;padding:16px;width:min(92vw,420px);background:var(--card);color:var(--ink)}
  dialog::backdrop{background:rgba(10,15,30,.55)}
  label{display:block;margin:10px 0 4px;font-weight:700}
  .toast{position:fixed;inset-inline:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);
    color:var(--bg);padding:10px 14px;border-radius:10px;display:none;z-index:3000;text-align:center}
  /* شاشات كاملة: اللغة + تسجيل الدخول */
  .screen{position:fixed;inset:0;z-index:2500;background:var(--bg);display:none;flex-direction:column;justify-content:center;
    align-items:center;padding:24px;padding-top:calc(24px + env(safe-area-inset-top,0px));overflow-y:auto}
  .screen.on{display:flex}
  .panel{width:min(100%,380px)}
  .panel h1{font-size:30px;margin-bottom:6px}
  .panel .slogan{font-size:17px;color:var(--ink);margin-bottom:22px;line-height:1.5}
  .panel h2{font-size:18px;margin:0 0 12px}
  .sep{display:flex;align-items:center;gap:10px;color:var(--muted);margin:14px 0}
  .sep::before,.sep::after{content:"";flex:1;height:1px;background:var(--line)}
  .btn.google{background:#fff;color:#222;border:1.5px solid var(--line)}
  .btn.fb{background:#1877F2}
  .leaflet-container{font-family:'Tajawal',sans-serif}
</style>
</head>
<body>

<!-- 1) اختيار اللغة -->
<div class="screen" id="langScreen">
  <div class="panel">
    <h1>Ss Maps</h1>
    <p class="slogan">اختار اللغة · Choisis ta langue · Choose your language</p>
    <button class="btn full" data-lang="ar">العربية (الدارجة)</button>
    <button class="btn full alt" data-lang="fr">Français</button>
    <button class="btn full alt" data-lang="en">English</button>
  </div>
</div>

<!-- 2) تسجيل الدخول -->
<div class="screen" id="loginScreen">
  <div class="panel">
    <h1 data-i18n="appName"></h1>
    <p class="slogan" data-i18n="slogan"></p>
    <h2 data-i18n="loginTitle"></h2>
    <button class="btn full google" id="gBtn" data-i18n="google"></button>
    <button class="btn full fb" id="fbBtn" data-i18n="facebook"></button>
  </div>
</div>

<!-- 3) التطبيق -->
<header>
  <div class="top">
    <h1 data-i18n="appName"></h1>
    <div class="row" style="align-items:center">
      <select id="langSel" aria-label="Language">
        <option value="ar">العربية</option><option value="fr">Français</option><option value="en">English</option>
      </select>
      <button class="btn alt small" id="logoutBtn" style="display:none" data-i18n="logout"></button>
    </div>
  </div>
  <p class="slogan" data-i18n="slogan"></p>
  <div class="row">
    <div style="flex:1"><select id="citySel" data-i18n-aria="whereTo"></select></div>
    <div style="flex:1"><select id="fromSel" data-i18n-aria="fromWhere"></select></div>
  </div>
</header>

<div id="map"></div>

<main>
  <div id="routeBox"></div>
  <div class="sheet-title">
    <h2 id="listTitle"></h2>
    <button class="btn alt" id="addBtn" data-i18n="add"></button>
  </div>
  <div class="row" style="margin-bottom:10px">
    <button class="btn go" id="routeCityBtn" style="flex:1" data-i18n="routeCity"></button>
    <button class="btn alt" id="gmapsBtn" style="flex:1" data-i18n="openGmaps"></button>
  </div>
  <div id="people"></div>
</main>

<dialog id="dlg">
  <form method="dialog" onsubmit="return false">
    <h2 style="margin:0 0 4px" data-i18n="regTitle"></h2>
    <p style="margin:0;color:var(--muted)" id="dlgCity"></p>
    <label for="fName" data-i18n="name"></label>
    <input id="fName" required maxlength="40" autocomplete="name">
    <label for="fPhone" data-i18n="phone"></label>
    <input id="fPhone" inputmode="tel" maxlength="20" autocomplete="tel" dir="ltr">
    <label for="fNote" data-i18n="note"></label>
    <textarea id="fNote" rows="2" maxlength="140" data-i18n-ph="notePH"></textarea>
    <div class="row" style="margin-top:14px">
      <button class="btn" id="saveBtn" type="button" style="flex:1" data-i18n="save"></button>
      <button class="btn alt" id="cancelBtn" type="button" style="flex:1" data-i18n="cancel"></button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast"></div>

/* ============ Supabase ============
   SQL (دوّزو فـ SQL Editor):

   create table people (
     id bigint generated always as identity primary key,
     user_id uuid default auth.uid() references auth.users on delete cascade,
     name text not null check (char_length(name) <= 40),
     phone text,
     place text not null,
     note text check (char_length(note) <= 140),
     created_at timestamptz default now()
   );
   alter table people enable row level security;
   create policy "المسجلين يقراو" on people for select to authenticated using (true);
   create policy "كل واحد يسجل راسو" on people for insert to authenticated with check (auth.uid() = user_id);
   create policy "كل واحد يمسح ديالو" on people for delete to authenticated using (auth.uid() = user_id);

   وفـ Authentication > Providers فعّل Google و Facebook (مجانا). ما كاين حتى دخول بالهاتف حيت SMS مدفوع.
   وفـ Authentication > URL Configuration زيد رابط الموقع ديالك. */
const SUPABASE_URL='YOUR_URL', SUPABASE_KEY='YOUR_ANON_KEY';
const db=SUPABASE_URL.startsWith('http')?supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;
let user=null;

async function loadPeopleFor(place){
  if(db){
    const {data,error}=await db.from('people').select('*').eq('place',place).order('created_at',{ascending:false});
    if(error){toast(t('errLoad'));return[];}
    return data;
  }
  try{return(JSON.parse(localStorage.getItem('ma-people-v1'))||[]).filter(p=>p.place===place);}catch(e){return[];}
}
async function addPerson(p){
  if(db){const {error}=await db.from('people').insert(p);if(error)throw error;return;}
  let all=[];try{all=JSON.parse(localStorage.getItem('ma-people-v1'))||[];}catch(e){}
  all.push({id:'u'+Date.now(),...p});
  try{localStorage.setItem('ma-people-v1',JSON.stringify(all));}catch(e){}
}

/* ============ تسجيل الدخول ============ */
const redirectTo=location.origin+location.pathname;

$('fbBtn').onclick=()=>db.auth.signInWithOAuth({provider:'facebook',options:{redirectTo}});
$('logoutBtn').onclick=()=>db.auth.signOut();

function gate(){
  const needLang=!lang, needLogin=!!db&&!user;
  $('langScreen').classList.toggle('on',needLang);
  $('loginScreen').classList.toggle('on',!needLang&&needLogin);
  $('logoutBtn').style.display=db&&user?'inline-block':'none';
}

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(map);
let cityMarker=null,routeLine=null,myPos=null;const peopleLayer=L.layerGroup().addTo(map);
const citySel=$('citySel'),fromSel=$('fromSel');
const placeById=id=>PLACES.find(p=>p.id==id);
const cur=()=>placeById(citySel.value);
const typeLabel=p=>t(p.type==='مدينة'?'city':'village');

function buildSelects(){
  const c=citySel.value,f=fromSel.value;
  citySel.innerHTML=PLACES.map(p=>`<option value="${p.id}">${esc(p.name)} (${typeLabel(p)})</option>`).join('');
  fromSel.innerHTML=`<option value="me">${esc(t('fromMe'))}</option>`+PLACES.map(p=>`<option value="${p.id}">${esc(t('from'))} ${esc(p.name)}</option>`).join('');
  if(c)citySel.value=c;if(f)fromSel.value=f;
}
function toast(m){const e=$('toast');e.textContent=m;e.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display='none',3200);}

async function renderCity(){
  const c=cur();if(!c)return;
  if(cityMarker)map.removeLayer(cityMarker);
  cityMarker=L.marker([c.lat,c.lng]).addTo(map).bindPopup(esc(c.name));
  if(renderCity.last!==c.id){map.flyTo([c.lat,c.lng],c.type==='مدينة'?12:13,{duration:1});renderCity.last=c.id;}
  $('listTitle').textContent=t('peopleIn')+' '+c.name;
  $('people').innerHTML=`<div class="empty">${esc(t('loading'))}</div>`;
  if(db&&!user){return;}
  const here=await loadPeopleFor(c.name);
  if(cur()!==c)return;
  peopleLayer.clearLayers();
  here.forEach((p,i)=>{const j=(i+1)*0.004;
    L.circleMarker([c.lat+j*(i%2?1:-1),c.lng+j*(i%3?1:-1)],{radius:8,color:'#1F3FBF',fillColor:'#F2A900',fillOpacity:.95,weight:2})
      .addTo(peopleLayer).bindPopup(esc(p.name));});
  $('people').innerHTML=here.length?here.map(p=>{
    const ph=(p.phone||'').replace(/\D/g,'');const intl=ph.startsWith('0')?'212'+ph.slice(1):ph;
    return `<div class="person"><b>${esc(p.name)}</b><p>${esc(p.note||'')}</p><div class="actions">
      ${ph?`<a class="btn" href="tel:${esc(ph)}">${esc(t('call'))}</a>
      <a class="btn alt" href="https://wa.me/${esc(intl)}" target="_blank" rel="noopener">${esc(t('whatsapp'))}</a>`:''}</div></div>`;
  }).join(''):`<div class="empty">${esc(t('noOne'))} ${esc(c.name)}.<br>${esc(t('beFirst'))}</div>`;
}

/* ============ الطريق (OSRM) ============ */
function getStart(){return new Promise((res,rej)=>{
  if(fromSel.value!=='me'){const f=placeById(fromSel.value);return res({lat:f.lat,lng:f.lng});}
  if(myPos)return res(myPos);
  if(!navigator.geolocation)return rej(new Error(t('errGps')));
  navigator.geolocation.getCurrentPosition(
    p=>{myPos={lat:p.coords.latitude,lng:p.coords.longitude};res(myPos);},
    ()=>rej(new Error(t('errGps'))),{enableHighAccuracy:true,timeout:10000});});}
async function showRoute(){
  const c=cur(),box=$('routeBox');box.style.display='block';box.textContent=t('searching');
  try{
    const s=await getStart();
    const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${s.lng},${s.lat};${c.lng},${c.lat}?overview=full&geometries=geojson`);
    const d=await r.json();if(!d.routes||!d.routes.length)throw new Error(t('errNoRoute'));
    const rt=d.routes[0];if(routeLine)map.removeLayer(routeLine);
    routeLine=L.geoJSON(rt.geometry,{style:{color:'#1F3FBF',weight:5}}).addTo(map);
    map.fitBounds(routeLine.getBounds(),{padding:[30,30]});
    const km=Math.round(rt.distance/1000),h=Math.floor(rt.duration/3600),m=Math.round((rt.duration%3600)/60);
    box.innerHTML=`<strong>${km} ${esc(t('km'))}</strong> · ${esc(t('approx'))} ${h?h+' '+esc(t('hr'))+' ':''}${m} ${esc(t('min'))}<br>${esc(t('dest'))}: ${esc(c.name)}`;
  }catch(e){box.textContent=e.message||t('errNoRoute');}
}

/* ============ أحداث ============ */
const dlg=$('dlg');
$('addBtn').onclick=()=>{$('dlgCity').textContent=t('place')+': '+cur().name;dlg.showModal();};
$('cancelBtn').onclick=()=>dlg.close();
$('saveBtn').onclick=async()=>{
  const name=$('fName').value.trim();if(!name){$('fName').focus();return;}
  try{await addPerson({name,phone:$('fPhone').value.trim(),place:cur().name,note:$('fNote').value.trim()});}
  catch(e){toast(t('errSave'));return;}
  ['fName','fPhone','fNote'].forEach(i=>$(i).value='');dlg.close();renderCity();toast(t('saved'));
};
citySel.onchange=()=>{if(routeLine){map.removeLayer(routeLine);routeLine=null;}$('routeBox').style.display='none';renderCity();};
$('routeCityBtn').onclick=showRoute;
$('gmapsBtn').onclick=()=>{const c=cur();window.open(`https://www.google.com/maps/dir/?api=1&destination=${c.lat},${c.lng}&travelmode=driving`,'_blank','noopener');};
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;localStorage.setItem('lang',lang);applyLang();gate();});
$('langSel').onchange=e=>{lang=e.target.value;localStorage.setItem('lang',lang);applyLang();};

/* ============ بداية التطبيق ============ */
(async()=>{
  if(!lang)lang='ar';           // مؤقتا للترجمة، الشاشة كتبقى باش يختار
  const chosen=localStorage.getItem('lang');
  buildSelects();
  citySel.value=PLACES.find(p=>p.name==='مراكش').id;
  applyLang();
  if(!chosen)lang=null;
  if(db){
    const {data}=await db.auth.getSession();user=data.session?.user||null;
    db.auth.onAuthStateChange((_e,s)=>{user=s?.user||null;gate();renderCity();});
  }
  gate();
  if(!lang)lang='ar';
  renderCity();
})();

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
